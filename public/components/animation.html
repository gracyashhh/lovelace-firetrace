}</script><script>let DATA, page='lab',mode='recorded',selected='20CAL10',progress=0,playing=true,speed=1,freeze=0,drag=false,angle=.1,zoom=1,study='FLEX',objective='extinction';let conditions={oxygen:21,pressure:1,fuel:'Methanol',diameter:1.86,gas:'N₂ balance'};let reduced=false,lastTime=0;const $=s=>document.querySelector(s);const el=(id)=>document.getElementById(id);const fmt=(v,n=1)=>v===null||v===undefined||!Number.isFinite(+v)?'Not recorded':Number(v).toFixed(n);const safe=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');let hostRecord=null;function activeRecord(){return hostRecord?.id===selected?hostRecord:DATA.flex.find(r=>r.id===selected)||DATA.flex[1]}
function sourceLink(url,text='NASA PSI source'){return `<a href="${url}" target="_blank" rel="noopener" class="text-link">${text} ↗</a>`}function render(){el('main').innerHTML=renderLab();wireLab();for(const [id,label] of Object.entries({toggle:'Play or pause animation',restart:'Restart animation',timeline:'Animation progress',speed:'Playback speed'}))el(id).setAttribute('aria-label',label);}
function renderLab(){const r=activeRecord(),s=mode==='recorded';return `<div class="lab-page page-enter"><div class="page-heading lab-heading"><div><div class="eyebrow"><span class="line-dot"></span>NASA PSI / MICROGRAVITY COMBUSTION LAB</div><h1>Fire behaves differently <span>beyond gravity.</span></h1><p>Actual archived experiments meet interactive, explicitly illustrative fire visualisation.</p></div><div class="mission-tag"><div class="signal"></div><span>RESEARCH SESSION<br><b>FLEX / PSI-69</b></span></div></div><div class="lab-grid"><section class="scene-panel preview-surface"><div class="scene-top"><span class="scene-label"><span class="scene-live"></span> EXPERIMENT CHAMBER / VIEW 001</span><button class="tiny-action" id="reduced">${reduced?'STANDARD EFFECTS':'REDUCED EFFECTS'}</button></div><div class="canvas-overlay">FREE-FLOATING FUEL DROPLET<b>Microgravity / μg</b></div><canvas class="preview-canvas" id="flame"></canvas><div class="scene-overlay-preview">DRAG TO ORBIT · SCROLL TO ZOOM</div><div class="scene-bottom"><span>● ILLUSTRATIVE OPTICAL MODEL</span><span>NOT CFD</span></div></section><aside class="control-panel"><div class="control-title"><div><span class="kicker">CONTROL DECK</span><h3>Experiment parameters</h3></div><span>⚙</span></div><div class="mode-switch"><button id="record" class="${s?'active':''}">NASA recorded</button><button id="explore" class="${!s?'active':''}">Explore</button></div>${s?`<label class="field-label">SELECT NASA EXPERIMENT<select id="exp">${(hostRecord?[...DATA.flex.filter(r=>r.id!==hostRecord.id),hostRecord]:DATA.flex).filter(r=>r===hostRecord||(r.initialDiameterMm&&r.burnTimeS)).map(x=>`<option value="${safe(x.id)}" ${x.id===r.id?'selected':''}>${safe(x.id)} · ${safe(x.fuel)} · ${safe(x.outcome)}</option>`).join('')}</select></label><div class="experiment-card"><div class="mini-top"><span class="record-chip">✓ RECORDED TEST</span><span>FLEX #${r.testNumber}</span></div><h3>${r.id}</h3><p>${r.fuel} in a controlled gas mixture</p><div class="measure-grid">${metric('OXYGEN',fmt(r.oxygenFraction*100,1)+'%')}${metric('PRESSURE',fmt(r.pressureMmHg,1)+' mmHg')}${metric('INITIAL Ø',fmt(r.initialDiameterMm,2)+' mm')}${metric('EXTINCTION Ø',fmt(r.extinctionDiameterMm,2)+' mm')}${metric(r===hostRecord?'BURNING CONSTANT':'RATE (ARCHIVE UNIT)',fmt(r.burningRateSourceMm,2)+(r===hostRecord?' mm²/s':' mm'))}${metric('BURN DURATION',fmt(r.burnTimeS,1)+' s')}</div></div><div class="outcome-strip"><span>RECORDED OUTCOME</span><strong class="${r.outcome==='Extinction'?'green-text':'amber-text'}">${r.outcome}</strong></div><p class="gas-note">Mole fractions O₂ ${fmt(r.oxygenFraction,2)} · N₂ ${fmt(r.nitrogenFraction,2)} · CO* ${fmt(r.co2Fraction,2)} · He ${fmt(r.heliumFraction,2)}</p>`:`<div class="exploration-caption">Qualitative parameter study — no combustion predictions.</div>${slider('oxygen','Oxygen concentration',10,40,.5,'%')}${slider('pressure','Ambient pressure',.4,3.3,.1,' bar')}${slider('diameter','Initial droplet diameter',1,5,.1,' mm')}<label class="field-label">LIQUID FUEL<select id="fuel"><option ${conditions.fuel==='Methanol'?'selected':''}>Methanol</option><option ${conditions.fuel==='Heptane'?'selected':''}>Heptane</option></select></label><label class="field-label">SURROUNDING GAS<select id="gas"><option>N₂ balance</option><option ${conditions.gas==='CO₂ enriched'?'selected':''}>CO₂ enriched</option><option ${conditions.gas==='Helium mix'?'selected':''}>Helium mix</option></select></label><div class="context-alert">Illustrative visualisation — not a validated combustion prediction. No invented extinction times or burning rates.</div>`}<button id="insights-from-lab" class="go-analysis">Inspect measured FLEX evidence <span>→</span></button></aside></div><div class="under-scene"><section class="playback-panel"><div class="playback-header"><div><span class="kicker">EXPERIMENT TIMELINE</span><h3>${s?'Recorded outcomes · reconstructed frames':'Uncalibrated visual sequence'}</h3></div><span id="time-value" class="time-text">0.0 s</span></div><div class="playback-track"><button id="toggle" class="play-button">${playing?'Ⅱ':'▶'}</button><button id="restart" class="restart-button">↻</button><input id="timeline" type="range" min="0" max="1" step=".001" value="${progress}"/><select id="speed" class="speed-select"><option value=".5" ${speed===.5?'selected':''}>0.5×</option><option value="1" ${speed===1?'selected':''}>1×</option><option value="2" ${speed===2?'selected':''}>2×</option></select></div><div class="timeline-labels"><span>START</span><span>${s?r.outcome.toUpperCase():'END'}</span></div><div class="disclosure" id="interp-message">NASA test parameters are scalar measurements. Intermediate flame frames are illustrative.</div></section><section class="insight-panel"><div class="insight-icon">✦</div><div class="insight-content"><span class="kicker">EVIDENCE INTERPRETATION</span><h3>${s?r.outcome==='Extinction'?'A recorded flame extinction event':r.outcome==='Disruption'?'A disruption is not extinction':'Experiment completed':'Explore near known experiments'}</h3><p>${s?'Visuals reproduce the outcome category but not measured high-speed footage. Interpolation is clearly labelled.':`Evidence proximity is not a physical model. There are ${DATA.flex.filter(x=>x.fuel===conditions.fuel).length} locally loaded tests for ${conditions.fuel}.`}</p>${sourceLink(r.source)}</div></section></div>${!s?`<section class="nearby-panel"><div class="section-small-heading"><div><span class="kicker">NEAR YOUR SETTINGS</span><h3>Similar archived tests</h3></div><span>Nearest values are not predictions</span></div><div id="near"></div></section>`:''}</div>`}
function metric(k,v){return `<div class="metric"><span>${k}</span><strong>${v}</strong></div>`}function slider(id,label,min,max,step,unit){return `<div class="preview-control"><label>${label}<span id="${id}-value">${conditions[id]}${unit}</span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${conditions[id]}"></div>`}
function wireLab(){el('record').onclick=()=>{mode='recorded';progress=0;playing=true;render()};el('explore').onclick=()=>{mode='explore';progress=0;playing=true;render()};el('reduced').onclick=()=>{reduced=!reduced;render()};el('insights-from-lab').onclick=()=>{parent.location.hash='scientific-plots'};el('toggle').onclick=()=>{if(progress>=1)progress=0;playing=!playing;el('toggle').textContent=playing?'Ⅱ':'▶'};el('restart').onclick=()=>{progress=0;playing=true;el('toggle').textContent='Ⅱ'};el('timeline').oninput=e=>{progress=Number(e.target.value);playing=false;el('toggle').textContent='▶';updatePlayback()};el('speed').onchange=e=>speed=Number(e.target.value);if(mode==='recorded'){el('exp').onchange=e=>{selected=e.target.value;progress=0;playing=true;render()}}else{for(const k of ['oxygen','pressure','diameter']){el(k).oninput=e=>{conditions[k]=Number(e.target.value);el(k+'-value').textContent=e.target.value+(k==='oxygen'?'%':k==='pressure'?' bar':' mm');renderNear()}}el('fuel').onchange=e=>{conditions.fuel=e.target.value;renderNear()};el('gas').onchange=e=>conditions.gas=e.target.value;renderNear()}const c=el('flame');let x=0;c.onpointerdown=e=>{drag=true;x=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag){angle+=(e.clientX-x)*.015;x=e.clientX}};c.onpointerup=()=>drag=false;c.onwheel=e=>{e.preventDefault();zoom=Math.max(.65,Math.min(1.5,zoom-e.deltaY*.0004))};updatePlayback();renderNear()}
function renderNear(){const target=el('near');if(!target)return;const a=DATA.flex.filter(x=>x.fuel===conditions.fuel&&x.oxygenFraction!==null&&x.pressureMmHg!==null).map(x=>({...x,dist:Math.abs(x.oxygenFraction*100-conditions.oxygen)/10+Math.abs(x.pressureMmHg/750-conditions.pressure)})).sort((a,b)=>a.dist-b.dist).slice(0,4);target.innerHTML=a.map(r=>`<div class="preview-row"><b>${r.id}</b><span>${fmt(r.oxygenFraction*100,1)}% O₂</span><span>${fmt(r.pressureMmHg/750,2)} bar</span><span>${r.outcome}</span><button data-load="${r.id}">LOAD →</button></div>`).join('');target.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{selected=b.dataset.load;mode='recorded';progress=0;playing=true;render()})}
function updatePlayback(){if(page!=='lab')return;const r=activeRecord();if(el('timeline')){el('timeline').value=progress;el('timeline').style.setProperty('--fill',(100*progress)+'%');el('time-value').textContent=mode==='recorded'&&r.burnTimeS!==null?`${(r.burnTimeS*progress).toFixed(2)} / ${r.burnTimeS.toFixed(2)} s`:`${Math.round(progress*100)}%`;const hasInter=mode==='recorded'&&r.outcome==='Extinction'&&r.initialDiameterMm!==null&&r.extinctionDiameterMm!==null;el('interp-message').textContent=mode==='recorded'?(hasInter?`Droplet radius follows an illustrative squared-diameter interpolation between ${r.initialDiameterMm} mm and ${r.extinctionDiameterMm} mm. Intermediate observations were not measured.`:'No valid paired extinction diameters. Droplet size is not extrapolated. The flame is illustrative.'):'Sequence progress is not experimental physical time and produces no numerical prediction.'}}
function drawFlame(){if(page!=='lab')return;const c=el('flame');if(!c)return;const dpr=Math.min(2,window.devicePixelRatio||1),w=c.clientWidth,h=c.clientHeight,needW=Math.round(w*dpr),needH=Math.round(h*dpr);if(c.width!==needW||c.height!==needH){c.width=needW;c.height=needH}const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);const cx=w*.51+Math.sin(angle)*20,cy=h*.51,base=Math.min(w,h),r=base*.24*zoom;const now=performance.now()*.001;const rec=activeRecord(),oxygen=mode==='recorded'?rec.oxygenFraction*100:conditions.oxygen;const fuel=mode==='recorded'?rec.fuel:conditions.fuel;let cool=Math.min(1,Math.max(0,(oxygen<18?.9:oxygen<24?.62:.26)+(fuel==='Methanol'?.13:-.10)+(mode==='explore'&&conditions.gas==='CO₂ enriched'?.15:0)));let fade=mode==='recorded'&&rec.outcome==='Extinction'&&progress>.82?Math.max(0,1-(progress-.82)/.18):1;const droplet0=mode==='recorded'?rec.initialDiameterMm:conditions.diameter;let diameter=droplet0||2;const hasEnd=mode==='recorded'&&rec.outcome==='Extinction'&&rec.extinctionDiameterMm!==null&&rec.initialDiameterMm!==null;if(hasEnd)diameter=Math.sqrt(diameter*diameter+(rec.extinctionDiameterMm**2-diameter*diameter)*progress);const dropletR=Math.max(14,Math.min(35,diameter*10*zoom));
// Perspective-reticle guides and gridded experiment chamber.
g.save();g.strokeStyle='rgba(64,133,188,.14)';g.lineWidth=1;for(let i=-10;i<=10;i++){g.beginPath();g.moveTo(cx+i*60,-20);g.lineTo(cx+i*60,h+30);g.stroke();g.beginPath();g.moveTo(-20,cy+i*54);g.lineTo(w+20,cy+i*54);g.stroke()}g.restore();for(let i=0;i<3;i++){g.beginPath();g.ellipse(cx,cy,r*(1.14+i*.23),r*(1.14+i*.23)*(.86+.14*Math.abs(Math.cos(angle+i))),angle*.2+i*.39,0,Math.PI*2);g.setLineDash([3,11]);g.strokeStyle=`rgba(75,150,215,${.29-i*.06})`;g.lineWidth=1;g.stroke()}g.setLineDash([]);
// Volumetric-looking additive light diffusion, but not CFD.
g.save();g.globalCompositeOperation='lighter';if(!reduced){for(let j=4;j>=1;j--){const glow=g.createRadialGradient(cx,cy,r*.2,cx,cy,r*(1+j*.16));glow.addColorStop(0,`rgba(18,108,255,${.018*fade})`);glow.addColorStop(.55,`rgba(23,75,245,${.022*fade})`);glow.addColorStop(1,'rgba(5,20,44,0)');g.fillStyle=glow;g.beginPath();g.arc(cx,cy,r*(1+j*.16),0,Math.PI*2);g.fill()}}
for(let layer=0;layer<4;layer++){const segments=reduced?80:180;const rr=r*(.67+layer*.16)*(mode==='explore'?(1+(conditions.pressure-1)*.05):1);g.beginPath();for(let i=0;i<=segments;i++){const theta=Math.PI*2*i/segments;const flutter=Math.sin(theta*8+now*1.2+layer)*.029+Math.sin(theta*13-now*.9+layer)*.024+Math.sin(theta*21+now*.6)*.009;const radial=rr*(1+flutter);const x=cx+Math.cos(theta)*radial;const y=cy+Math.sin(theta)*radial*(.99+.02*Math.cos(angle));if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.closePath();const grad=g.createRadialGradient(cx-r*.1,cy+r*.02,r*.12,cx,cy,rr*1.1);grad.addColorStop(0,`rgba(38,172,255,${.015*fade})`);grad.addColorStop(.55,`rgba(${Math.round(45+cool*20)},${Math.round(106+cool*80)},255,${(.07+layer*.013)*fade})`);grad.addColorStop(.83,`rgba(${Math.round(220-130*cool)},${Math.round(92+40*cool)},${Math.round(190+45*cool)},${(.055+layer*.015)*fade})`);grad.addColorStop(1,`rgba(40,112,250,${.015*fade})`);g.fillStyle=grad;g.fill();g.strokeStyle=`rgba(${Math.round(230-145*cool)},${Math.round(133+82*cool)},255,${(.16+layer*.026)*fade})`;g.lineWidth=layer===0?2.3:1.5;g.stroke()}g.restore();
// Liquid droplet with specular highlight and shaded edge.
const ball=g.createRadialGradient(cx-dropletR*.42,cy-dropletR*.43,2,cx,cy,dropletR);ball.addColorStop(0,'#aacce5');ball.addColorStop(.09,'#436b91');ball.addColorStop(.4,'#254666');ball.addColorStop(.76,'#122942');ball.addColorStop(1,'#071623');g.beginPath();g.arc(cx,cy,dropletR,0,Math.PI*2);g.fillStyle=ball;g.fill();g.strokeStyle='rgba(164,226,250,.6)';g.lineWidth=1.5;g.stroke();g.beginPath();g.ellipse(cx-dropletR*.3,cy-dropletR*.35,dropletR*.23,dropletR*.1,-.6,0,Math.PI*2);g.fillStyle='rgba(193,246,255,.48)';g.fill();}
function animate(t){let dt=Math.min((t-lastTime)||16,100);lastTime=t;if(playing&&page==='lab'){progress=Math.min(1,progress+dt/14000*speed);if(progress===1){playing=false;if(el('toggle'))el('toggle').textContent='▶'}if(Math.round(t)%8===0)updatePlayback()}drawFlame();requestAnimationFrame(animate)}

DATA=JSON.parse(el('embedded-data').textContent);render();requestAnimationFrame(animate);
// Host integration only: map the selected lab record into the existing renderer schema.
if(new URLSearchParams(location.search).has('lab')){
 document.documentElement.classList.add('lab-embed');
 window.firetraceLab={
  onSelect:null,
  setExperiment(record,inputs){
   playing=false;progress=0;
   if(inputs){
    mode='explore';conditions={...conditions,fuel:inputs.fuel,oxygen:inputs.oxygen*100,pressure:inputs.pressure/750.061683,diameter:inputs.diameter};
   }else{
    mode='recorded';selected=record.identifier;
    const r={id:selected,testNumber:record.test,fuel:record.fuel,oxygenFraction:record.oxygen,pressureMmHg:record.pressure,initialDiameterMm:record.diameter,extinctionDiameterMm:record.extinction_diameter,burningRateSourceMm:record.burning_rate,burnTimeS:record.burn_time,outcome:record.test_end,nitrogenFraction:record.nitrogen,co2Fraction:record.co2,heliumFraction:record.helium,source:'https://psi.nasa.gov/physci/repo/data/investigations/PSI-69'};
    hostRecord=r;
   }
   render();
  }
 };
 document.addEventListener('change',e=>{if(e.target.id==='exp')window.firetraceLab.onSelect?.(activeRecord().testNumber)});
 document.addEventListener('click',e=>{if(e.target.closest('[data-load]'))window.firetraceLab.onSelect?.(activeRecord().testNumber)});
}
